<!doctype html>
<html lang="ja" data-theme="lightsout">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ミュージックルーム</title>
<meta name="description" content="ダウンロードした曲を端末に保存して聴く、自分専用の音楽アプリ">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root, [data-theme="lightsout"] {
  --bg:#000000; --surface:#16181C; --hover:#1D1F23; --border:#2F3336; --border2:#3E4144;
  --text:#E7E9EA; --text2:#71767B; --primary:#EFF3F4; --on-primary:#0F1419; --shadow:rgba(255,255,255,.08);
}
[data-theme="dim"] {
  --bg:#15202B; --surface:#1E2732; --hover:#22303C; --border:#38444D; --border2:#425364;
  --text:#F7F9F9; --text2:#8B98A5; --primary:#EFF3F4; --on-primary:#0F1419; --shadow:rgba(0,0,0,.4);
}
[data-theme="light"] {
  --bg:#FFFFFF; --surface:#F7F9F9; --hover:#E8ECEE; --border:#EFF3F4; --border2:#CFD9DE;
  --text:#0F1419; --text2:#536471; --primary:#0F1419; --on-primary:#FFFFFF; --shadow:rgba(0,0,0,.18);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
body { font-family: "Chirp", system-ui, -apple-system, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
  font-size: 15px; line-height: 1.45; overscroll-behavior-y: contain; }
button, input, select { font: inherit; color: inherit; }
.ic { width: 22px; height: 22px; flex: none; display: block; }
.ic.s { width: 18px; height: 18px; } .ic.l { width: 26px; height: 26px; }
#app { display: flex; flex-direction: column; height: 100%; }
header.top { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
  display: flex; align-items: center; gap: 10px; min-height: 56px; }
header.top h1 { font-size: 20px; font-weight: 800; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
main { flex: 1; overflow-y: auto; padding: 12px 16px 170px; }
.muted { color: var(--text2); font-size: 13px; }
.h2 { font-weight: 700; font-size: 16px; margin: 0 0 8px; }
.card { border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
.row { display: flex; align-items: center; gap: 8px; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border2); background: transparent;
  border-radius: 999px; padding: 8px 16px; font-weight: 700; min-height: 38px; cursor: pointer; }
.btn:active { background: var(--hover); }
.btn.primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.btn.sm { padding: 5px 12px; min-height: 32px; font-size: 13px; }
.btn[disabled] { opacity: .45; }
.icon-btn { border: 0; background: transparent; border-radius: 999px; padding: 8px; cursor: pointer; display: inline-flex; color: var(--text); }
.icon-btn:active { background: var(--hover); }
.icon-btn.dim { color: var(--text2); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 10px; scrollbar-width: none; }
.chip { border: 1px solid var(--border2); border-radius: 999px; padding: 6px 14px; font-weight: 600; background: transparent; white-space: nowrap; cursor: pointer; }
.chip.on { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
input.field, select.field { width: 100%; background: var(--bg); border: 1px solid var(--border2); border-radius: 12px; padding: 10px 12px; outline: none; }
input.field:focus, select.field:focus { border-color: var(--text); }
input.search { background: var(--surface); border-color: var(--surface); border-radius: 999px; padding: 9px 16px; }
label.check { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
label.check input { width: 20px; height: 20px; accent-color: var(--primary); }
.list { margin: 0 -8px; }
.track { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 12px; cursor: pointer; }
.track:active { background: var(--hover); }
.track.missing { opacity: .45; cursor: default; }
.track.now .t-title { font-weight: 800; }
.art { width: 48px; height: 48px; border-radius: 8px; background: var(--surface); flex: none; object-fit: cover; display: grid; place-items: center; color: var(--text2); overflow: hidden; }
.art img { width: 100%; height: 100%; object-fit: cover; }
.t-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t-sub { color: var(--text2); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.empty { text-align: center; color: var(--text2); padding: 48px 16px; }
/* 下部：ミニプレイヤーとナビ */
#mini { position: fixed; left: 8px; right: 8px; bottom: calc(env(safe-area-inset-bottom) + 70px); z-index: 20;
  background: var(--surface); border-radius: 14px; padding: 8px 8px 10px; display: none; align-items: center; gap: 10px;
  box-shadow: 0 6px 24px var(--shadow); overflow: hidden; }
#mini.show { display: flex; }
#mini .art { width: 42px; height: 42px; }
#mini .bar { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--text); width: 0; }
nav.bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--bg); border-top: 1px solid var(--border);
  display: flex; padding: 4px 4px calc(env(safe-area-inset-bottom) + 4px); }
nav.bottom button { flex: 1; border: 0; background: transparent; color: var(--text2); display: flex; flex-direction: column;
  align-items: center; gap: 2px; font-size: 11px; padding: 6px 0; border-radius: 12px; cursor: pointer; }
nav.bottom button.on { color: var(--text); font-weight: 700; }
nav.bottom button.on .ic { stroke-width: 2.5; }
#fab { position: fixed; right: 18px; bottom: calc(env(safe-area-inset-bottom) + 84px); z-index: 22; width: 56px; height: 56px;
  border-radius: 50%; border: 0; background: var(--primary); color: var(--on-primary); display: grid; place-items: center;
  box-shadow: 0 6px 20px var(--shadow); cursor: pointer; transition: bottom .2s; }
#fab.raised { bottom: calc(env(safe-area-inset-bottom) + 146px); }
/* シート・ダイアログ・トースト */
.overlay { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.5); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 560px; border-radius: 20px 20px 0 0; padding: 8px 8px calc(env(safe-area-inset-bottom) + 12px);
  border-top: 1px solid var(--border); max-height: 80vh; overflow-y: auto; }
.sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--border2); margin: 4px auto 10px; }
.sheet .item { display: flex; align-items: center; gap: 14px; width: 100%; border: 0; background: transparent; padding: 13px 14px; border-radius: 12px; text-align: left; font-weight: 600; cursor: pointer; }
.sheet .item:active { background: var(--hover); }
.sheet .title { padding: 4px 14px 8px; font-weight: 800; }
.dialog { background: var(--bg); border: 1px solid var(--border2); border-radius: 18px; padding: 18px; width: calc(100% - 32px); max-width: 420px; margin: auto; align-self: center; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 150px); z-index: 50;
  background: var(--primary); color: var(--on-primary); border-radius: 12px; padding: 11px 18px; font-weight: 600; font-size: 14px;
  max-width: calc(100% - 32px); display: none; text-align: center; }
/* 再生画面 */
#np { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: none; flex-direction: column;
  padding: calc(env(safe-area-inset-top) + 8px) 24px calc(env(safe-area-inset-bottom) + 24px); }
#np.show { display: flex; }
#np .big { width: min(100%, 52vh); aspect-ratio: 1; margin: 18px auto; border-radius: 16px; background: var(--surface); display: grid; place-items: center; overflow: hidden; color: var(--text2); }
#np .big img { width: 100%; height: 100%; object-fit: cover; }
#np .ttl { font-size: 22px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#np .ctrl { display: flex; align-items: center; justify-content: space-between; margin-top: 18px; }
#np .play { width: 68px; height: 68px; border-radius: 50%; background: var(--primary); color: var(--on-primary); border: 0; display: grid; place-items: center; cursor: pointer; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(var(--text), var(--text)) 0/var(--p, 0%) 100% no-repeat, var(--border2); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--text); margin-top: -5px; }
.big-num { font-size: 42px; font-weight: 800; line-height: 1.1; margin: 4px 0 12px; }
.stat { font-size: 22px; font-weight: 800; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.theme-tile { border-radius: 14px; padding: 14px; text-align: left; font-weight: 700; cursor: pointer; border: 1px solid var(--border2); }
.theme-tile.on { outline: 2px solid var(--text); outline-offset: 1px; }
.prog { height: 4px; border-radius: 2px; background: var(--surface); overflow: hidden; margin-top: 6px; }
.prog > div { height: 100%; background: var(--text); width: 0; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--text2); }
.dot.ok { background: var(--text); }
svg.chart { width: 100%; height: auto; display: block; }
.hbar { display: grid; grid-template-columns: 38% 1fr auto; align-items: center; gap: 10px; padding: 6px 0; font-size: 14px; }
.hbar .b { height: 10px; border-radius: 4px; background: var(--text2); }
.hbar .b.top { background: var(--text); }
.rank { width: 22px; color: var(--text2); font-weight: 800; text-align: center; }
code, .code { font-family: ui-monospace, "Cascadia Mono", monospace; background: var(--surface); border-radius: 8px; padding: 2px 6px; font-size: 13px; }
pre.code { padding: 10px 12px; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
<div id="app">
  <header class="top" id="top"></header>
  <main id="page"></main>
</div>
<div id="mini"></div>
<button id="fab" aria-label="ダウンロード"></button>
<nav class="bottom" id="nav"></nav>
<div id="np"></div>
<div id="toast"></div>
<input type="file" id="artpick" accept="image/*" hidden>
<input type="file" id="filepick" accept="audio/*,.mp3,.m4a,.opus,.ogg,.flac,.wav" multiple hidden>
<script src="firebase-config.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
