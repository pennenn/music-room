<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PC と連携</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #000; color: #E7E9EA;
    font-family: system-ui, "Segoe UI", "Yu Gothic UI", sans-serif; }
  .box { max-width: 420px; padding: 28px; border: 1px solid #2F3336; border-radius: 18px; text-align: center; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: #71767B; font-size: 14px; line-height: 1.6; }
  button { background: #EFF3F4; color: #0F1419; border: 0; border-radius: 999px; padding: 10px 22px; font-weight: 700; font-size: 15px; cursor: pointer; }
</style>
</head>
<body>
<div class="box">
  <h1>ミュージックルーム：PC と連携</h1>
  <p id="msg">Google でログインすると、PC のアプリが同期できるようになります。</p>
  <button id="go">Google でログイン</button>
</div>
<script src="firebase-config.js"></script>
<script type="module">
// PC アプリが開いたページ。ログインした結果（更新用トークン）を PC の中（127.0.0.1）にだけ渡す
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const q = new URLSearchParams(location.search);
const port = Number(q.get("port")), state = q.get("state") || "";
const msg = document.getElementById("msg"), btn = document.getElementById("go");
if (!(port > 1024 && port < 65536) || !/^[\w-]{16,}$/.test(state)) {
  msg.textContent = "このページは PC アプリの「Google でログイン」から開いてください。"; btn.hidden = true;
}
btn.onclick = async () => {
  try {
    const auth = getAuth(initializeApp(self.FIREBASE_CONFIG));
    const { user } = await signInWithPopup(auth, new GoogleAuthProvider());
    const cfg = self.FIREBASE_CONFIG;
    const r = await fetch(`http://127.0.0.1:${port}/link`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ state, refreshToken: user.refreshToken, uid: user.uid, email: user.email,
        apiKey: cfg.apiKey, projectId: cfg.projectId }),
    });
    if (!r.ok) throw new Error("PC アプリが応答しません");
    msg.textContent = `${user.email} で連携しました。このタブは閉じて構いません。`; btn.hidden = true;
  } catch (e) {
    msg.textContent = "連携できませんでした: " + (e.code || e.message) + "（PC アプリでもう一度「Google でログイン」を押してください）";
  }
};
</script>
</body>
</html>
